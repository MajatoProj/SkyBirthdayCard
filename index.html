<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1e">
<title>For You ✨</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; color: #fff; overflow-x: hidden;
    font-family: "Trebuchet MS", system-ui, sans-serif;
    /* night sky fading into a dark meadow */
    background: linear-gradient(#0b1220 0%, #16304a 30%, #1d4a52 55%, #1c4a3e 75%, #0d2a22 100%) fixed;
    -webkit-tap-highlight-color: transparent;
  }
  .grass { position: fixed; left: 0; right: 0; bottom: 0; height: 35vh; pointer-events: none;
    background: repeating-linear-gradient(95deg, #0000 0 5px, #2d5a2a33 5px 7px, #0000 7px 13px),
                linear-gradient(#0000, #0a1a0e);
    mask-image: linear-gradient(#0000, #000 40%); -webkit-mask-image: linear-gradient(#0000, #000 40%); }
  .mote { position: fixed; border-radius: 50%; background: #fff; pointer-events: none;
          box-shadow: 0 0 8px #fff; animation: drift linear infinite; }
  @keyframes drift { 0% { translate: 0 0; opacity: 0; } 20%, 80% { opacity: .7; } 100% { translate: 20px -140px; opacity: 0; } }

  h1 { position: relative; text-align: center; font-weight: normal; letter-spacing: 3px; font-size: 18px;
       padding: 26px 16px 0; opacity: .85; text-shadow: 0 0 10px #fff8; }

  .tree { position: relative; margin: 0 auto; max-width: 420px; }
  .tree svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .tree line { stroke: #ffffff40; stroke-width: 1.5; }
  .tree line.lit { stroke: #f0d595; stroke-width: 1.8; filter: drop-shadow(0 0 3px #f3d48a99); }

  .node { position: absolute; translate: -50% -50%; width: 70px; height: 70px; border-radius: 50%; border: none;
          display: grid; place-items: center; font-size: 36px; cursor: pointer; color: inherit; padding: 0;
          background: none; }
  .node img { width: 60px; height: 60px; object-fit: contain; }

  /* unlocked = white glyph with warm glow, locked = faded blue glyph (like Sky) */
  .unlocked .icon { filter: brightness(0) invert(.9) sepia(1) saturate(1.6) brightness(1.05) drop-shadow(0 0 5px #f3d48a99); }
  .unlocked { background: radial-gradient(#f3d48a33, #0000 65%); }
  .locked .icon { filter: brightness(0) invert(.75) sepia(1) saturate(5) hue-rotate(165deg) blur(var(--blur, 4px)); opacity: .55; }

  /* ready = next gift she can tap: pulsing golden halo */
  .ready::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; pointer-events: none;
                  background: radial-gradient(#ffe9b070, #0000 65%); animation: halo 1.6s ease-in-out infinite; }
  @keyframes halo { 50% { opacity: .25; scale: .85; } }
  .tree line { transition: stroke .8s; }
  .heart { width: 92px; height: 92px; font-size: 50px; }
  .heart.unlocked { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { scale: 1.1; filter: drop-shadow(0 0 18px #ffe9b0); } }
  .root { position: absolute; translate: -50% -50%; font-size: 30px; letter-spacing: 1px;
          text-shadow: 0 0 12px #fff8; white-space: nowrap; }

  .shake { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .new { animation: reveal 1.6s ease-out; }
  @keyframes reveal { 0% { scale: .3; filter: brightness(3); } 60% { scale: 1.25; } 100% { scale: 1; } }

  /* ===== Sky-style effects ===== */
  .tree > * { transition: opacity 1.1s ease-out; transition-delay: var(--d, 0s); }
  .tree.hidden > * { opacity: 0; }
  .spark { position: fixed; z-index: 20; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%;
           pointer-events: none; background: #fff6d6; box-shadow: 0 0 6px #ffd75e, 0 0 14px #ffc83d;
           animation: spark ease-out forwards; }
  @keyframes spark { to { translate: var(--dx) var(--dy); opacity: 0; scale: .3; } }
  .tree line.flow { transition: stroke-dashoffset .45s ease-in-out; stroke-width: 2.5;
                    filter: drop-shadow(0 0 6px #ffd75e); }
  .glowout { position: fixed; z-index: 30; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
             pointer-events: none; background: radial-gradient(#fffaf0 30%, #ffe9b0 50%, #ffe9b000 70%);
             transition: scale 1.7s ease-in; }
  .glowout.on { scale: 70; }

  /* ===== opening screen: unlit candle, tap to light ===== */
  #intro { position: fixed; inset: 0; z-index: 10; cursor: pointer; overflow: hidden;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           background: radial-gradient(circle at 50% 58%, #1c1628, #07070d 70%); transition: opacity 1.4s; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro .for { letter-spacing: 4px; font-size: 18px; opacity: 0; margin-bottom: 70px;
                text-shadow: 0 0 12px #ffcf7a; transition: opacity 1.2s .4s; }
  #intro.lit .for { opacity: .9; }
  .candle { position: relative; width: 32px; height: 120px; border-radius: 7px 7px 4px 4px;
            background: linear-gradient(90deg, #6e0f1a, #b81f30 38%, #e2475a 52%, #a01a2a 75%, #5e0c16);
            box-shadow: 0 0 0 #0000; transition: box-shadow 1.5s; }
  /* melted wax drip */
  .candle::after { content: ""; position: absolute; top: 0; left: 5px; width: 7px; height: 30px;
                   border-radius: 0 0 5px 5px; background: linear-gradient(90deg, #c92a3c, #e85566); }
  .candle::before { content: ""; position: absolute; top: -12px; left: 50%; translate: -50% 0;
                    width: 2px; height: 13px; border-radius: 1px; background: #2b2119; }
  #intro.lit .candle { box-shadow: 0 -20px 50px #ffb34755, inset 0 14px 18px -10px #ffcf7aaa; }
  .flame { position: absolute; left: 50%; bottom: calc(100% + 6px); width: 22px; height: 46px;
           margin-left: -11px; transform-origin: 50% 90%;
           border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
           background: radial-gradient(ellipse at 50% 78%, #fff 0 14%, #fff0b8 28%, #ffbe55 55%, #ff7a1a00 76%);
           filter: drop-shadow(0 0 10px #ffb347);
           scale: .14; opacity: .7; transition: scale 1.1s cubic-bezier(.2, 1.7, .4, 1), opacity .5s;
           animation: flicker 1.6s ease-in-out infinite; }
  #intro.lit .flame { scale: 1; opacity: 1; }
  @keyframes flicker {
    0%, 100% { transform: rotate(-2deg) scaleY(1); }
    25% { transform: rotate(1.5deg) scaleY(1.07); }
    50% { transform: rotate(-1deg) scaleY(.95); }
    75% { transform: rotate(2deg) scaleY(1.04); } }
  .halo { position: absolute; left: 50%; bottom: calc(100% - 20px); width: 260px; height: 260px;
          margin: 0 0 -130px -130px; border-radius: 50%; pointer-events: none;
          background: radial-gradient(#ffcf7a66, #ffb34722 40%, #0000 70%);
          opacity: .15; transition: opacity 1s, scale 2.2s ease-in; animation: breathe 3s ease-in-out infinite; }
  #intro.lit .halo { opacity: 1; }
  #intro.bloom .halo { scale: 9; }
  @keyframes breathe { 50% { opacity: .55; } }
  #intro .hint { position: absolute; bottom: 16%; font-size: 14px; letter-spacing: 2px;
                 animation: breathe 2.4s ease-in-out infinite; transition: opacity .5s; }
  #intro.lit .hint { opacity: 0; animation: none; }

  .toast { position: fixed; left: 50%; bottom: 30px; translate: -50% 0; padding: 10px 18px;
           border-radius: 20px; background: #000a; backdrop-filter: blur(6px); font-size: 14px;
           opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* Sky-style popups: no box, just light and text floating over the dimmed world */
  dialog { margin: auto; border: none; padding: 10px 16px; max-width: min(340px, 90vw); overflow: visible;
           text-align: center; color: #fff; background: none; text-shadow: 0 0 10px #0008; }
  dialog[open] { animation: dlgin .6s ease-out; }
  @keyframes dlgin { from { opacity: 0; translate: 0 14px; } }
  dialog::backdrop { background: radial-gradient(#0b1a2acc, #000d 75%); backdrop-filter: blur(4px); }
  dialog .big { font-size: 70px; }
  dialog .big img { width: 140px; height: 140px; object-fit: contain; }
  dialog h2 { font-weight: normal; margin: 6px 0; letter-spacing: 1px; }
  dialog p { opacity: .9; line-height: 1.4; }
  dialog .num { margin-top: 10px; font-size: 12px; letter-spacing: 2px; opacity: .6; }
  dialog .gnum { color: #ffe9b0; text-shadow: 0 0 12px #ffe9b0; }
  dialog .small { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; opacity: .7; }
  /* glowing light, like a winged light / candle light */
  .orb { position: relative; width: 120px; height: 120px; margin: 0 auto 14px; display: grid; place-items: center; }
  .orb::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
                 background: radial-gradient(#fffbea 0 12%, #ffe9b0aa 24%, #ffc83d33 45%, #0000 70%);
                 animation: pulse 2.4s ease-in-out infinite; }
  .orb::after { content: "✦"; position: relative; font-size: 46px; color: #fffbea;
                text-shadow: 0 0 10px #fff, 0 0 24px #ffd75e, 0 0 50px #ffc83d; animation: spin 12s linear infinite; }
  @keyframes spin { to { rotate: 1turn; } }
  /* thin gold divider with a diamond, like Sky's menus */
  .rule { display: flex; align-items: center; gap: 8px; margin: 12px auto; width: 70%; color: #f3d48a; font-size: 9px; }
  .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, #0000, #f3d48a99); }
  .rule::after { scale: -1 1; }
  /* round icon button */
  dialog button { margin-top: 14px; width: 54px; height: 54px; border-radius: 50%; border: 1.5px solid #fffc;
                  background: #fff1; color: #fff; font-size: 22px; box-shadow: 0 0 14px #ffe9b066, inset 0 0 10px #fff3; }
  dialog button:active { scale: .92; }
</style>
</head>
<body>
<div id="intro">
  <p class="for">✦ <span id="introName"></span> ✦</p>
  <div class="candle"><div class="halo"></div><div class="flame"></div></div>
  <p class="hint" id="hint">tap to light the candle</p>
</div>
<div class="grass"></div>
<h1>✦ for you ✦</h1>
<div class="tree hidden" id="tree"><svg id="lines"></svg></div>

<dialog id="dlg">
  <div class="big" id="dIcon"></div>
  <h2 id="dName"></h2>
  <p id="dNote"></p>
  <p class="num" id="dNum"></p>
  <button onclick="dlg.close()" aria-label="close">✕</button>
</dialog>
<dialog id="grab">
  <div class="orb"></div>
  <p class="small">Something new unlocked</p>
  <div class="rule">◆</div>
  <h2>Grab present <span class="gnum" id="grabNum"></span>!</h2>
  <button onclick="grab.close()" aria-label="okay">✓</button>
</dialog>
<div class="toast" id="toast"></div>

<script>
// ===== EDIT HERE =====
// Order = bottom to top, and the present number = position in this list (1st = present #1).
// She unlocks them herself: a gift opens once the gift below it (and everything listed before
// that) is claimed. Ready gifts have a golden halo; tapping shows "Grab present #N!" and lights it up.
// side: leave out = on the main trunk; "left" / "right" = branches off the trunk node below it.
// icon: an emoji, or an image like "img/necklace.png" (transparent PNG works best).
// blur: optional, how blurry the locked silhouette is in px (default 4, 0 = sharp).
const ROOT = "Uiltje"; // name at the bottom of the tree
const ITEMS = [
  { name: "Noibat Card",          icon: "img/card.png",   note: "Write a little message here." },
  { name: "Miku's Leek",          icon: "img/leek.png",   note: "Write a little message here." },
  { name: "Plushie",              icon: "img/plush.png",  note: "Write a little message here.", side: "left", blur: 6 },
  { name: "Constellation Hoodie", icon: "img/hoodie.png", note: "Write a little message here.", side: "right" },
  { name: "Miku Figure",          icon: "img/miku.png",   note: "Write a little message here." },
  { name: "Sky Collection Box",   icon: "img/skybox.png", note: "Write a little message here." },
];
// =====================

const ROW = 130, SIDE = 0.3; // vertical gap between trunk nodes; side branch offset (fraction of width)
const tree = document.getElementById("tree"), svg = document.getElementById("lines");
const iconHTML = i => i.includes(".") ? `<img class="icon" src="${i}" alt="">` : `<span class="icon">${i}</span>`;
const claimed = []; // not saved: every refresh starts the tree over

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800);
}
function shake(el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }

// layout in "rows": trunk nodes go up one row; side nodes hang off the last trunk node, a bit higher
const rootPt = { x: 0, y: 0, sides: { left: 0, right: 0 } };
let trunk = rootPt, row = 0;
const pts = ITEMS.map(it => {
  if (!it.side || trunk === rootPt) {
    const p = { x: 0, y: ++row, parent: trunk, sides: { left: 0, right: 0 } };
    return trunk = p;
  }
  const n = ++trunk.sides[it.side];
  return { x: it.side === "left" ? -1 : 1, y: trunk.y + 0.35 + 0.45 * n, parent: trunk };
});
const heartPt = { x: 0, y: Math.max(row + 1, ...pts.map(p => Math.ceil(p.y))), parent: trunk };
const H = heartPt.y * ROW + 150;
tree.style.height = H + "px";

function place(el, p) {
  el.style.left = `calc(50% + ${p.x * SIDE * 100}%)`;
  el.style.top = (H - 50 - p.y * ROW) + "px";
}
function line(a, b, lit) {
  if (!a) return;
  const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
  // shortcut: px from width at load, lines won't follow a phone rotation until reload
  const W = tree.clientWidth, X = p => W * (0.5 + p.x * SIDE), Y = p => H - 50 - p.y * ROW;
  const dx = X(b) - X(a), dy = Y(b) - Y(a), len = Math.hypot(dx, dy);
  const gap = (p, r) => [X(p) + dx / len * r, Y(p) + dy / len * r];
  const [x1, y1] = gap(a, a === rootPt ? 24 : 40), [x2, y2] = gap(b, b === heartPt ? -52 : -40);
  l.setAttribute("x1", x1); l.setAttribute("y1", y1);
  l.setAttribute("x2", x2); l.setAttribute("y2", y2);
  if (lit) l.classList.add("lit");
  svg.append(l);
  return l;
}

// on = she claimed it this visit
// avail = the gift it branches from, and every gift listed before that one, are claimed
// (so branches off the same gift open together, in any order, and the next one waits for all of them)
const isOn = i => claimed.includes(i);
const avail = i => {
  const parent = pts.indexOf(pts[i].parent); // -1 = grows from the name at the bottom
  return ITEMS.every((_, j) => j > parent || isOn(j));
};
const lines = [], buttons = [];
let pending = null; // gift waiting for the grab popup to close

function setState(b, i) {
  const it = ITEMS[i], on = isOn(i);
  b.className = "node " + (on ? "unlocked" : "locked") + (avail(i) && !on ? " ready" : "");
  b.innerHTML = iconHTML(it.icon); // no name under the icon: it would give the gift away
}

ITEMS.forEach((it, i) => {
  const b = buttons[i] = document.createElement("button"), p = pts[i];
  if (it.blur != null) b.style.setProperty("--blur", it.blur + "px");
  setState(b, i);
  b.onclick = () => {
    if (!avail(i)) { shake(b); return toast("Not yet… ✨"); }
    if (!isOn(i)) { pending = [b, i]; grabNum.textContent = "#" + (i + 1); return grab.showModal(); }
    dIcon.innerHTML = iconHTML(it.icon).replace(' class="icon"', "");
    dName.textContent = it.name; dNote.textContent = it.note; dNum.textContent = `present #${i + 1}`; dlg.showModal();
  };
  place(b, p); lines[i] = line(p.parent, p, isOn(i)); tree.append(b);
});

const heart = document.createElement("button");
heart.innerHTML = `<span class="icon">❤️</span>`;
place(heart, heartPt); const heartLine = line(heartPt.parent, heartPt, false); tree.append(heart);
const allDone = () => ITEMS.every((_, i) => isOn(i));
function updateHeart() {
  heart.className = "node heart " + (allDone() ? "unlocked" : "locked");
}
updateHeart();
heart.onclick = () => allDone() ? goBirthday()
  : (shake(heart), toast(`${ITEMS.filter((_, i) => !isOn(i)).length} more to go… 🎁`));

// ===== Sky-style effects =====
const center = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

// little golden lights flying out from a point (up = how much they drift upward, like collecting light)
function burst([x, y], n = 22, up = 40) {
  for (let k = 0; k < n; k++) {
    const s = document.createElement("span"), a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 80;
    s.className = "spark";
    Object.assign(s.style, { left: x + "px", top: y + "px", animationDuration: .9 + Math.random() * .9 + "s" });
    s.style.setProperty("--dx", Math.cos(a) * d + "px");
    s.style.setProperty("--dy", Math.sin(a) * d - up - Math.random() * up + "px");
    document.body.append(s);
    setTimeout(() => s.remove(), 2000);
  }
}

// light travels along a line from the gift below to the new one, then calls done
function flowLine(l, done) {
  const g = l.cloneNode(), len = l.getTotalLength();
  g.classList.add("lit", "flow");
  g.style.strokeDasharray = len; g.style.strokeDashoffset = len;
  l.after(g);
  requestAnimationFrame(() => requestAnimationFrame(() => g.style.strokeDashoffset = 0));
  setTimeout(() => { l.classList.add("lit"); g.remove(); done(); }, 450);
}

// heart tapped when everything is open: burst + golden light fills the screen, then the birthday page
function goBirthday() {
  const c = center(heart), w = document.createElement("div");
  burst(c, 45, 60);
  w.className = "glowout"; w.style.left = c[0] + "px"; w.style.top = c[1] + "px";
  document.body.append(w);
  requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add("on")));
  setTimeout(() => location.href = "birthday.html", 1700);
}

// closing the grab popup (button, Esc or back) claims the gift: light flows up the line, then it lights up
grab.addEventListener("close", () => {
  if (!pending) return;
  const [b, i] = pending; pending = null;
  claimed.push(i);
  flowLine(lines[i], () => {
    buttons.forEach(setState); // also gives the next gift(s) their halo
    b.classList.add("new"); burst(center(b));
    if (allDone()) flowLine(heartLine, () => { updateHeart(); heart.classList.add("new"); burst(center(heart), 34); });
  });
});

// opening screen: tap lights the flame (sparks rise), the glow fills the screen, the tree fades in branch by branch
introName.textContent = ROOT;
intro.onclick = () => {
  if (intro.classList.contains("lit")) return;
  intro.classList.add("lit");
  const flame = intro.querySelector(".flame");
  [0, 350, 800, 1300].forEach(t => setTimeout(() => burst(center(flame), 10, 90), t));
  setTimeout(() => intro.classList.add("bloom"), 1600);
  setTimeout(() => { intro.classList.add("gone"); tree.classList.remove("hidden"); }, 2700);
  setTimeout(() => intro.remove(), 4200);
};

const rootEl = document.createElement("div");
rootEl.className = "root"; rootEl.textContent = ROOT; place(rootEl, rootPt); tree.append(rootEl);
// fade-in order: name first, then lines, then each gift from the bottom up, heart last
rootEl.style.setProperty("--d", "0s"); svg.style.setProperty("--d", ".3s");
buttons.forEach((b, i) => b.style.setProperty("--d", .5 + i * .2 + "s"));
heart.style.setProperty("--d", .6 + buttons.length * .2 + "s");

// floating light motes over the meadow
for (let i = 0; i < 18; i++) {
  const m = document.createElement("span"), s = 2 + Math.random() * 3;
  m.className = "mote";
  Object.assign(m.style, { width: s + "px", height: s + "px", left: Math.random() * 100 + "vw",
    top: 40 + Math.random() * 60 + "vh", animationDuration: 6 + Math.random() * 6 + "s",
    animationDelay: -Math.random() * 10 + "s" });
  document.body.append(m);
}

addEventListener("load", () => scrollTo(0, document.body.scrollHeight)); // start at the bottom like Sky
</script>
</body>
</html>
